name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          # Caches ~/.npm; a separate node_modules cache is pointless because
          # `npm ci` always deletes node_modules before installing.
          cache: "npm"
      - run: npm ci
      # Blocking gate: only what actually ships to users. A high-severity
      # advisory in a runtime dependency should stop the pipeline.
      - run: npm audit --omit=dev --audit-level=high
      # Dev-only advisories are worth seeing but must not block merging. In
      # August 2026 a DoS advisory in eslint's brace-expansion chain failed
      # this step for three weeks and held up every Dependabot PR — including
      # the ones that would have fixed the runtime advisories underneath it.
      - run: npm audit --audit-level=high
        continue-on-error: true
      - run: npm run format:check
      - run: npm run lint
      - run: npm run validate:puzzles
      - run: npm run validate:messages
      - run: npx tsc --noEmit
      - run: npx tsc --project tsconfig.scripts.json
      - run: npm run test
      - run: npm run build
        env:
          DEEPSEEK_API_KEY: "ci-fake-key-not-used-during-build"

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      # Chromium only: these specs check routing, status codes, headers and
      # canvas interaction, none of which is engine-specific, and one browser
      # keeps the download off the critical path.
      - run: npx playwright install --with-deps chromium
      - run: npm run build
        env:
          DEEPSEEK_API_KEY: "ci-fake-key-not-used-during-build"
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
