name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          # Caches ~/.npm; a separate node_modules cache is pointless because
          # `npm ci` always deletes node_modules before installing.
          cache: "npm"
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run format:check
      - run: npm run lint
      - run: npm run validate:puzzles
      - run: npm run validate:messages
      - run: npx tsc --noEmit
      - run: npx tsc --project tsconfig.scripts.json
      - run: npm run test
      - run: npm run build
        env:
          DEEPSEEK_API_KEY: "ci-fake-key-not-used-during-build"
